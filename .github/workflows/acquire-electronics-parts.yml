name: Acquire and audit CC0 electronics parts dataset

on:
  push:
    paths:
      - ".github/workflows/acquire-electronics-parts.yml"
      - "research/tools/acquire_electronics_parts.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image inspection dependency
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Download public CC0 source archive
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-all-errors \
            "https://codeload.github.com/praneelchand10/Electronics-Parts-Dataset/zip/refs/heads/main" \
            --output /tmp/electronics-parts-source.zip
          sha256sum /tmp/electronics-parts-source.zip | tee source-sha256.txt
          test -s /tmp/electronics-parts-source.zip
      - name: Extract and audit nested image archives
        run: |
          python research/tools/acquire_electronics_parts.py \
            --archive /tmp/electronics-parts-source.zip \
            --output dataset-audit/report.json \
            --work-dir /tmp/vidya-electronics-parts
      - name: Preserve acquired source and audit report as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: vidya-electronics-parts-acquired
          path: |
            /tmp/electronics-parts-source.zip
            /tmp/vidya-electronics-parts/
            dataset-audit/report.json
            source-sha256.txt
          if-no-files-found: error
          retention-days: 30
