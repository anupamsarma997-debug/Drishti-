name: Prepare real KIT ball-screw segmentation dataset

on:
  push:
    paths:
      - ".github/workflows/prepare-kit-ballscrew-yolo-seg.yml"
      - "research/tools/prepare_kit_ballscrew_seg.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: vidya-kit-ballscrew-real-defect-dataset
          repository: anupamsarma997-debug/Drishti-
          run-id: 42565434806
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source-artifact
      - name: Extract upstream archive
        run: |
          set -euo pipefail
          mkdir extracted
          unzip -q source-artifact/kit-ballscrew-bsdata.zip -d extracted
      - name: Install image preparation dependency
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Prepare leakage-aware YOLO segmentation splits
        run: |
          set -euo pipefail
          python research/tools/prepare_kit_ballscrew_seg.py --source-root extracted --output prepared/kit-ballscrew
          cat prepared/kit-ballscrew/preparation_report.json
      - name: Upload prepared real dataset
        uses: actions/upload-artifact@v4
        with:
          name: vidya-kit-ballscrew-yolo-seg-prepared
          path: prepared/kit-ballscrew/
          if-no-files-found: error
          retention-days: 30
