name: Android CI

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dataset audit test dependencies
        run: python -m pip install --disable-pip-version-check pyarrow Pillow
      - name: Test dataset audit and preparation utilities
        run: python -m unittest discover -s research/tools -p 'test_*.py' -v
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Run unit tests and assemble debug APK
        run: gradle testDebugUnitTest assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vidya-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
