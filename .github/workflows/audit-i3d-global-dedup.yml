name: Global I3D cross-shard duplicate audit

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  global-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install parquet audit dependencies
        run: python -m pip install --disable-pip-version-check pyarrow Pillow
      - name: Download audited shard 00000
        uses: actions/download-artifact@v4
        with:
          name: vidya-i3d-tools-shard-00000-audited
          path: /tmp/i3d/shard-00000
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 42494453950
      - name: Download audited shard 00001
        uses: actions/download-artifact@v4
        with:
          name: vidya-i3d-tools-shard-00001-audited
          path: /tmp/i3d/shard-00001
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 42494664824
      - name: Download audited shard 00002
        uses: actions/download-artifact@v4
        with:
          name: vidya-i3d-tools-shard-00002-audited
          path: /tmp/i3d/shard-00002
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 42494928495
      - name: Download audited shard 00003
        uses: actions/download-artifact@v4
        with:
          name: vidya-i3d-tools-shard-00003-audited
          path: /tmp/i3d/shard-00003
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 42495025879
      - name: Download audited shard 00004
        uses: actions/download-artifact@v4
        with:
          name: vidya-i3d-tools-shard-00004-audited
          path: /tmp/i3d/shard-00004
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 42495254135
      - name: Download audited shard 00005
        uses: actions/download-artifact@v4
        with:
          name: vidya-i3d-tools-shard-00005-audited
          path: /tmp/i3d/shard-00005
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 42495359661
      - name: Download audited shard 00006
        uses: actions/download-artifact@v4
        with:
          name: vidya-i3d-tools-shard-00006-audited
          path: /tmp/i3d/shard-00006
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 42495459107
      - name: Download audited shard 00007
        uses: actions/download-artifact@v4
        with:
          name: vidya-i3d-tools-shard-00007-audited
          path: /tmp/i3d/shard-00007
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 42495599571
      - name: Download audited shard 00008
        uses: actions/download-artifact@v4
        with:
          name: vidya-i3d-tools-shard-00008-audited
          path: /tmp/i3d/shard-00008
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 42495677350
      - name: Download audited shard 00009
        uses: actions/download-artifact@v4
        with:
          name: vidya-i3d-tools-shard-00009-audited
          path: /tmp/i3d/shard-00009
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 42495757520
      - name: Download audited shard 00010
        uses: actions/download-artifact@v4
        with:
          name: vidya-i3d-tools-shard-00010-audited
          path: /tmp/i3d/shard-00010
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 42495866783
      - name: Download audited shard 00011
        uses: actions/download-artifact@v4
        with:
          name: vidya-i3d-tools-shard-00011-audited
          path: /tmp/i3d/shard-00011
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 42495991311
      - name: Audit global image duplicates and annotation consistency
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' PARQUETS < <(find /tmp/i3d -name 'train-*.parquet' -print0 | sort -z)
          test "${#PARQUETS[@]}" -eq 12
          python research/tools/audit_i3d_cross_shard.py --parquet "${PARQUETS[@]}" --output dataset-audit/i3d-global-cross-shard-report.json
      - name: Upload global cross-shard report
        uses: actions/upload-artifact@v4
        with:
          name: vidya-i3d-global-cross-shard-audit
          path: dataset-audit/i3d-global-cross-shard-report.json
          if-no-files-found: error
          retention-days: 30
