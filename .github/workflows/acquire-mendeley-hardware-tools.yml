name: Check Mendeley real-world hardware tools dataset access

on:
  push:
    paths:
      - ".github/workflows/acquire-mendeley-hardware-tools.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-access:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check public archive API access without exposing credentials
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p acquisition
          HTTP_STATUS="$(curl --silent --show-error --location --output acquisition/api-response.json --write-out '%{http_code}' "https://api.data.mendeley.com/datasets/gmjkzdxhc6/zip?version=2" -H "Accept: application/json")"
          python - "$HTTP_STATUS" <<'PY'
          import json, sys
          from pathlib import Path
          status=sys.argv[1]
          body=Path("acquisition/api-response.json").read_text(errors="replace")
          report={
            "dataset":"Hardware Tools Complete Dataset",
            "dataset_id":"gmjkzdxhc6",
            "version":2,
            "http_status":status,
            "api_access":"available" if status=="200" else "requires_authorized_access" if status=="401" else "unavailable",
            "archive_downloaded":False,
            "note":"No credentials were supplied or stored. A 401 response means the public archive endpoint requires an authorized Mendeley session/API token."
          }
          if status=="200":
            try:
              data=json.loads(body)
              report["archive_status"]=data.get("status")
              report["download_url_returned"]=bool(data.get("url"))
            except Exception:
              report["response_parse"]="not_json"
          Path("acquisition/mendeley-access-check.json").write_text(json.dumps(report,indent=2)+"\n")
          print(json.dumps(report,indent=2))
          PY
      - name: Upload access check report
        uses: actions/upload-artifact@v4
        with:
          name: vidya-mendeley-access-check
          path: acquisition/mendeley-access-check.json
          if-no-files-found: error
          retention-days: 30
